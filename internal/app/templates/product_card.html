{{define "content"}}
<article class="page-card">
	<h1 class="card-title">{{.Title}}</h1>

	<form method="post" action="/organizations/{{.OrganizationID}}/products/{{.Product.ID}}">
		{{if .Product.ID}}
		<label for="id">ID</label>
		<input id="id" type="text" value="{{.Product.ID}}" readonly disabled>
		{{end}}

		<label for="uuid">UUID</label>
		<input id="uuid" name="uuid" type="text" value="{{.Product.UUID}}">

		{{if .Orgs}}
		<label for="organization_id">Организация</label>
		<select id="organization_id" name="organization_id" required>
			<option value="">Выберите организацию</option>
			{{range .Orgs}}
			<option value="{{.UUID}}"{{if eq .UUID $.Product.UUID}} selected{{end}}>{{.Name}}</option>
			{{end}}
		</select>
		{{end}}

		<label for="name">Наименование</label>
		<input id="name" name="name" type="text" value="{{.Product.Name}}" required>

		<label for="unit">Ед. изм</label>
		<input id="unit" name="unit" type="text" value="{{.Product.Unit}}">

		<label for="active">
			<input id="active" name="active" type="checkbox"{{if .Product.Active}} checked{{end}}>
			Активен
		</label>

		<button type="submit">Сохранить</button>
		<a href="/organizations/{{.OrganizationID}}/products" role="button" class="outline">Назад</a>
	</form>
</article>
{{end}}
