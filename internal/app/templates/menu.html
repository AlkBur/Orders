{{define "header"}}
<header class="app-header">
	<div class="app-header__content">
		<form method="post" action="/logout">
			<button type="submit" class="outline secondary">Выход</button>
		</form>
	</div>
</header>
{{end}}
{{define "content"}}
<article class="page-card">
	<h1 class="card-title">Главное меню</h1>
	<nav class="main-menu">
		{{range .Items}}
		<a href="{{.Href}}" role="button" class="outline">{{.Text}}</a>
		{{end}}
	</nav>
</article>
{{end}}
