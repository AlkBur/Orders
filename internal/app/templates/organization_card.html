
{{define "content"}}
<article class="page-card">
	<h1 class="card-title">{{.Title}}</h1>

	<form method="post" action="/organizations/{{.Org.UUID}}">
		{{if not .IsNew}}
		<label for="id">ID</label>
		<input id="id" type="text" value="{{.Org.UUID}}" readonly disabled>
		{{end}}

		<label for="name">Наименование</label>
		<input id="name" name="name" type="text" value="{{.Org.Name}}" required>

		<label for="active">
			<input id="active" name="active" type="checkbox"{{if .Org.Active}} checked{{end}}>
			Активна
		</label>

		<button type="submit">Сохранить</button>
		<a href="/organizations" role="button" class="outline">Назад</a>
	</form>
</article>
{{end}}
