{{define "header"}}
<header class="app-header">
	<div class="app-header__content">
		<form method="post" action="/logout">
			<button type="submit" class="outline secondary">Выход</button>
		</form>
	</div>
</header>
{{end}}

{{define "content"}}
<article class="page-card">
	<h1 class="card-title">{{.Title}}</h1>

	<form method="post" action="/organizations">
		<label for="uuid">UUID</label>
		<input id="uuid" name="uuid" type="text" value="{{.Org.UUID}}" required>

		<label for="name">Наименование</label>
		<input id="name" name="name" type="text" value="{{.Org.Name}}" required>

		<label for="active">
			<input id="active" name="active" type="checkbox"{{if .Org.Active}} checked{{end}}>
			Активна
		</label>

		<button type="submit">Сохранить</button>
		<a href="/organizations" role="button" class="outline">Назад</a>
	</form>
</article>
{{end}}
