{{define "content"}}
<div class="list-header">
	<h1>{{.Title}}</h1>
	{{if not .PickerMode}}
	<div class="toolbar">
		<a href="{{.NewURL}}" class="icon-button icon-button--labeled">
			<img src="/static/icons/plus.svg" alt="">Добавить
		</a>
	</div>
	{{end}}
</div>
<div class="list-table">
	<table>
		<thead>
			<tr>
				{{range .Columns}}
				<th scope="col">{{.Label}}</th>
				{{end}}
				<th scope="col" class="col-actions"></th>
			</tr>
		</thead>
		<tbody>
			{{range .Rows}}
			<tr>
				{{range .Cells}}
				<td>{{.}}</td>
				{{end}}
				<td class="col-actions">
				{{if $.PickerMode}}
					<a href="{{$.ReturnURL}}?select_id={{.ID}}&select_field={{$.PickerField}}&return_to={{$.ReturnURL}}" class="icon-button" aria-label="Выбрать">
						<img src="/static/icons/search.svg" alt="">
					</a>
				{{else if .URL}}
					<a href="{{.URL}}">{{$.RowAction.Label}}</a>
				{{else}}
					<a href="{{$.RowAction.BaseURL}}/{{.ID}}">{{$.RowAction.Label}}</a>
				{{end}}
				</td>
			</tr>
			{{else}}
			<tr>
				<td colspan="99">{{$.EmptyText}}</td>
			</tr>
			{{end}}
		</tbody>
	</table>
</div>
{{end}}
