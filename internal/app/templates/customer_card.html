{{define "content"}}
<article class="page-card">
	<h1 class="card-title">{{.Title}}</h1>

	<form method="post" action="/organizations/{{.OrganizationID}}/customers/{{.Customer.ID}}">
		{{if .Customer.ID}}
		<label for="id">ID</label>
		<input id="id" type="text" value="{{.Customer.ID}}" readonly disabled>
		{{end}}

		<label for="uuid">UUID</label>
		<input id="uuid" name="uuid" type="text" value="{{.Customer.UUID}}">

		{{if .Orgs}}
		<label for="organization_id">Организация</label>
		<select id="organization_id" name="organization_id" required>
			<option value="">Выберите организацию</option>
			{{range .Orgs}}
			<option value="{{.UUID}}"{{if eq .UUID $.Customer.UUID}} selected{{end}}>{{.Name}}</option>
			{{end}}
		</select>
		{{end}}

		<label for="name">Наименование</label>
		<input id="name" name="name" type="text" value="{{.Customer.Name}}" required>

		<label for="active">
			<input id="active" name="active" type="checkbox"{{if .Customer.Active}} checked{{end}}>
			Активен
		</label>

		<button type="submit">Сохранить</button>
		<a href="/organizations/{{.OrganizationID}}/customers" role="button" class="outline">Назад</a>
	</form>
</article>
{{end}}
