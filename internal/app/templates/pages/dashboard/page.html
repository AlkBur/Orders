{{define "page_content"}}
<div class="module-grid">
  {{range .Modules}}
    <a class="module-card{{if .Hero}} is-hero{{end}}" href="{{.URL}}">
      <div class="module-card-title">{{icon .Icon}} {{.Name}}</div>
      {{if .Note}}
      <div class="module-card-note">{{.Note}}</div>
      {{end}}
      <div class="module-card-count">{{.Count}}</div>
    </a>
  {{end}}
</div>
{{end}}
