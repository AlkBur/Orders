{{define "page_content"}}
{{template "toolbar" .Toolbar}}

<div class="stats-grid">
  <div class="stats-card">
    {{template "card_open" "Всего организаций"}}
      <p class="stats-value">{{.Stats.Total}}</p>
    {{template "card_close"}}
  </div>
  <div class="stats-card">
    {{template "card_open" "Активных"}}
      <p class="stats-value">{{.Stats.Active}}</p>
    {{template "card_close"}}
  </div>
</div>

<div class="section-heading">Последние организации</div>
{{template "list" .RecentList}}
{{end}}
