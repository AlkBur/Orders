{{define "page_content"}}
{{template "card_open" "Основная информация"}}
<form method="post" action="{{.FormAction}}">
  {{range .Fields}}
    {{template "form_field" .}}
  {{end}}
  {{if .HasPassword}}
  <p class="help">Пароль установлен.</p>
  {{else}}
  <p class="help">Пароль не установлен.</p>
  {{end}}
  <div class="buttons mt-2">
    <button type="submit" class="button is-primary">{{icon "save"}} <span>Сохранить</span></button>
  </div>
</form>
{{template "card_close"}}
{{end}}
