{{define "receipts_filter_toggle"}}
<button class="button filter-toggle {{if .HasFilter}}is-info{{end}}" type="button"
        :aria-pressed="open ? 'true' : 'false'" @click="open = !open">
  {{icon "filter"}}<span>Фильтр</span>
</button>
{{end}}

{{define "receipts_filter"}}
<div class="filter-panel" x-show="open" x-cloak>
  <form class="filter-form" method="get" action="{{.Search.URL}}"
        hx-get="{{.Search.URL}}" hx-target="#receipts-browser" hx-swap="outerHTML" hx-push-url="true">
    <div class="filter-grid">
      <div class="filter-field">
        <span class="filter-label">Период</span>
        <div class="filter-pair">
          <input class="input" type="date" name="date_from" value="{{.Search.Filter.DateFrom}}">
          <input class="input" type="date" name="date_to" value="{{.Search.Filter.DateTo}}">
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">Сумма</span>
        <div class="filter-pair">
          <input class="input" type="number" step="0.01" min="0" name="amount_from" value="{{.Search.Filter.AmountFrom}}"
            placeholder="от">
          <input class="input" type="number" step="0.01" min="0" name="amount_to" value="{{.Search.Filter.AmountTo}}"
            placeholder="до">
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">Организация</span>
        <div class="select is-fullwidth">
          <select name="organization_id" x-model.number="orgID" @change="onOrgChange()">
            <option value="0">Все организации</option>
            <template x-for="o in orgs" :key="o.id">
              <option :value="o.id" x-text="o.name"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">Контрагент</span>
        <div class="filter-picker">
          <div class="control is-expanded">
            <input class="input" type="text" readonly disabled :value="selectedCustomerName">
          </div>
          <div class="control">
            <button type="button" class="button" @click="openCustomerPicker()">Выбрать</button>
          </div>
          <div class="control">
            <button type="button" class="button" @click="clearCustomer()" :disabled="!custID">Очистить</button>
          </div>
        </div>
        <input type="hidden" name="customer_id" :value="custID">
      </div>
      <div class="filter-field">
        <span class="filter-label">Пользователь</span>
        <div class="select is-fullwidth">
          <select name="user_id">
            <option value="0">Все пользователи</option>
            {{range .Search.Filter.Users}}
            <option value="{{.ID}}" {{if eq .ID $.Search.Filter.UserID}}selected{{end}}>{{.Login}}</option>
            {{end}}
          </select>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">Статус</span>
        <div class="select is-fullwidth">
          <select name="status">
            <option value="">Все статусы</option>
            {{range .Search.Filter.Statuses}}
            <option value="{{.Value}}" {{if eq .Value $.Search.Filter.Status}}selected{{end}}>{{.Label}}</option>
            {{end}}
          </select>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">Действие установлено</span>
        <div class="filter-pair">
          <input class="input" type="date" name="action_set_from" value="{{.Search.Filter.ActionSetFrom}}">
          <input class="input" type="date" name="action_set_to" value="{{.Search.Filter.ActionSetTo}}">
        </div>
      </div>
      <div class="filter-actions">
        <button class="button is-primary" type="submit">Применить</button>
        <a class="button" href="{{.Search.URL}}">Сбросить</a>
      </div>
    </div>
  </form>

  <div class="modal picker-modal filter-picker-modal" x-cloak :class="{ 'is-active': pickerOpen }"
    role="dialog" aria-modal="true" aria-label="Выбор контрагента" @keydown.escape.window="closeCustomerPicker()">
    <div class="modal-background" @click="closeCustomerPicker()"></div>
    <div class="modal-card">
      <header class="modal-card-head picker-modal-head">
        <p class="modal-card-title">Выбор контрагента</p>
        <button type="button" class="delete" aria-label="Закрыть" @click="closeCustomerPicker()"></button>
      </header>
      <section class="modal-card-body">
        <div class="field">
          <input class="input" type="search" x-model="pickerQuery" placeholder="Поиск контрагентов..."
            autocomplete="off" spellcheck="false">
        </div>
        <ul class="filter-picker-list">
          <template x-for="c in filteredPickerCustomers" :key="c.id">
            <li>
              <button type="button" class="filter-picker-item" @click="selectCustomer(c)" x-text="c.name"></button>
            </li>
          </template>
        </ul>
        <p class="filter-picker-empty" x-show="filteredPickerCustomers.length === 0" x-cloak>Нет контрагентов</p>
      </section>
    </div>
  </div>
</div>
{{end}}
